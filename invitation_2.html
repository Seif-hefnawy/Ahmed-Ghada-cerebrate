<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We're Engaged — Ahmed &amp; Ghada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #f7dee4;
    --pink-bg-soft: #fbeaee;
    --paper: #fdf5f7;
    --ink: #211f1f;
    --ink-soft: #4a4646;
    --blue: #3548d4;
    --blue-deep: #2532a8;
    --line: rgba(33,31,31,0.18);
    --petal: #e7a9bb;
    --petal-2: #d98ca3;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--pink-bg);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }

  /* ---------- background texture ---------- */
  .bg-wash{
    position: fixed;
    inset:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 40%),
      radial-gradient(circle at 88% 92%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 45%),
      var(--pink-bg);
    z-index:-3;
  }

  /* ---------- petals ---------- */
  .petal-layer{
    position: fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index: 5;
  }
  .petal{
    position:absolute;
    top:-40px;
    opacity:0.85;
    will-change: transform;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .petal svg{ display:block; width:100%; height:100%; }
  @keyframes fall{
    0%{ transform: translate3d(0,-10vh,0) rotate(0deg); }
    100%{ transform: translate3d(var(--drift,40px), 110vh,0) rotate(340deg); }
  }

  /* ---------- entry overlay ---------- */
  #entry{
    position:fixed;
    inset:0;
    z-index:50;
    background: var(--pink-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    text-align:center;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  #entry.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #entry .heart{
    font-family:'Caveat', cursive;
    font-size:64px;
    color: var(--blue);
    line-height:1;
  }
  #entry h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(40px, 9vw, 64px);
    color: var(--blue);
    margin:0;
  }
  #entry p.sub{
    margin:0;
    font-size:13px;
    letter-spacing:1.5px;
    color: var(--ink-soft);
    text-transform:uppercase;
  }
  #entry button{
    margin-top:10px;
    border:none;
    background: var(--blue);
    color:#fff;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:1px;
    padding:12px 30px;
    border-radius:999px;
    cursor:pointer;
    transition: opacity 0.2s ease;
  }
  #entry button:hover{
    opacity:0.85;
  }


  /* ---------- sound toggle ---------- */
  #sound-toggle{
    position:fixed;
    top:18px;
    right:18px;
    z-index:40;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1.5px solid var(--blue);
    background: rgba(255,255,255,0.6);
    color: var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    opacity:0;
    transform: scale(0.85);
    transition: opacity 0.5s ease, transform 0.5s ease, background 0.2s ease;
  }
  #sound-toggle.show{ opacity:1; transform:scale(1); }
  #sound-toggle:hover{ background: rgba(255,255,255,0.9); }

  /* ---------- main card ---------- */
  main{
    position:relative;
    z-index:2;
    max-width: 620px;
    margin: 64px auto 90px;
    padding: 0 20px;
  }

  .frame{
    position:relative;
    background: var(--paper);
    border-radius: 4px;
    padding: 46px 34px 40px;
    box-shadow: 0 30px 60px -30px rgba(33,20,30,0.25);
  }

  .title-wrap{
    position:relative;
    text-align:start;
    margin-bottom: 26px;
    z-index: 3;
   
  }
  .title-wrap h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    color: var(--blue);
    font-size: clamp(46px, 9vw, 64px);
    line-height: 0.95;
    margin:0;
    transform: rotate(-4deg);
    display:inline-block;
  }
  .title-wrap .heart-mark{
    color: var(--blue);
    font-size:0.55em;
    vertical-align: 6px;
  }

  .photo-block{
    position:relative;
  }
  .photo-frame{
    overflow:hidden;
    border-radius: 2px;
    background:#fff;
  }
  .photo-frame img{
    display:block;
    width:100%;
    height:auto;
  }
  .dress-code{
    text-align:center;
    font-size:11.5px;
    letter-spacing:1.2px;
    line-height:1.8;
    color: var(--ink);
    font-weight:600;
    text-transform:uppercase;
    margin-top: 22px;
  }
  .dress-code .label{
    color: var(--ink);
    font-weight:700;
  }

  .details{
    text-align:center;
    margin-top: 30px;
  }
  .details p{
    margin:0 0 4px;
    font-weight:600;
    letter-spacing:1.4px;
    font-size: 15.5px;
    text-transform:uppercase;
    line-height:1.55;
  }
  .details .date{
    font-family:'Caveat', cursive;
    font-weight:700;
    color: var(--blue);
    font-size: clamp(38px, 8vw, 50px);
    margin: 8px 0 2px;
  }
  .details .venue{
    font-weight:600;
    letter-spacing:2px;
    font-size:14px;
  }

  .divider{
    width: 150px;
    height:1px;
    background: var(--line);
    margin: 26px auto;
  }

  /* ---------- countdown ---------- */
  .countdown-label{
    text-align:center;
    font-size:11px;
    letter-spacing:3px;
    color: var(--ink-soft);
    text-transform:uppercase;
    margin-bottom: 16px;
  }
  .countdown{
    display:flex;
    justify-content:center;
    gap: 10px;
  }
  .countdown .cell{
    background: var(--pink-bg-soft);
    border: 1px solid rgba(53,72,212,0.14);
    border-radius: 10px;
    padding: 12px 6px 10px;
    min-width: 66px;
    text-align:center;
  }
  .countdown .num{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 32px;
    color: var(--blue);
    line-height:1;
    display:block;
    font-variant-numeric: tabular-nums;
  }
  .countdown .unit{
    display:block;
    margin-top:4px;
    font-size:9.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color: var(--ink-soft);
  }

  footer{
    text-align:center;
    margin-top: 34px;
  }
  footer .sign{
    font-family:'Caveat', cursive;
    color: var(--blue);
    font-size: 24px;
  }

  @media (max-width: 480px){
    main{ margin: 44px auto 60px; }
    .frame{ padding: 34px 20px 30px; }
    .countdown{ gap: 7px; }
    .countdown .cell{ min-width: 56px; padding: 10px 4px 8px; }
    .countdown .num{ font-size: 26px; }
  }
</style>
</head>

  var left = Math.random()*100;
  var duration = 9 + Math.random()*8;
  var delay = Math.random()*4;
  var drift = (Math.random()*160 - 80) + 'px';
  el.style.left = left + 'vw';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.setProperty('--drift', drift);
  el.style.animationDuration = duration + 's';
  el.style.animationDelay = delay + 's';
  el.innerHTML = petalSVG(colors[Math.floor(Math.random()*colors.length)]);
  petalLayer.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, (duration+delay)*1000 + 500);
}

var petalInterval = null;
function startPetals(){
  for(var i=0;i<14;i++){ setTimeout(spawnPetal, i*250); }
  petalInterval = setInterval(spawnPetal, 700);
}

/* ---------------- ambient music (synthesised, royalty-free) ---------------- */
var musicStarted = false;
var musicPlaying = false;
var pad, arp, arpLoop;

function buildMusic(){
  var reverb = new Tone.Reverb({decay: 6, wet: 0.55}).toDestination();
  pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sine' },
    envelope: { attack: 2.2, decay: 1, sustain: 0.6, release: 4 }
  }).connect(reverb);
  pad.volume.value = -18;

  arp = new Tone.Synth({
    oscillator: { type: 'triangle' },
    envelope: { attack: 0.6, decay: 0.8, sustain: 0.2, release: 2 }
  }).connect(reverb);
  arp.volume.value = -24;

  var chords = [
    ['C4','E4','G4','B4'],
    ['A3','C4','E4','G4'],
    ['F3','A3','C4','E4'],
    ['G3','B3','D4','F4']
  ];
  var chordIndex = 0;
  var chordLoop = new Tone.Loop(function(time){
    pad.triggerAttackRelease(chords[chordIndex % chords.length], '4n', time);
    chordIndex++;
  }, '2m');

  var arpNotes = ['E4','G4','B4','C5','B4','G4'];
  var arpIndex = 0;
  arpLoop = new Tone.Loop(function(time){
    arp.triggerAttackRelease(arpNotes[arpIndex % arpNotes.length], '8n', time);
    arpIndex++;
  }, '2n');

  Tone.Transport.bpm.value = 58;
  chordLoop.start(0);
  arpLoop.start('1m');
}

function startMusic(){
  if(!musicStarted){
    Tone.start().then(function(){
      buildMusic();
      Tone.Transport.start();
      musicStarted = true;
      musicPlaying = true;
    });
  } else {
    Tone.Transport.start();
    musicPlaying = true;
  }
}
function stopMusic(){
  Tone.Transport.pause();
  musicPlaying = false;
}

document.getElementById('enterBtn').addEventListener('click', function(){
  document.getElementById('entry').classList.add('hidden');
  document.getElementById('sound-toggle').classList.add('show');
  startPetals();
  startMusic();
});

document.getElementById('sound-toggle').addEventListener('click', function(){
  if(musicPlaying){
    stopMusic();
    this.style.opacity = '0.55';
  } else {
    startMusic();
    this.style.opacity = '1';
  }
});
</script>
