<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We're Engaged — Ahmed &amp; Ghada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- مكتبة Font Awesome عشان أيقونة اللوكيشن -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root{
    --pink-bg: #f7dee4;
    --pink-bg-soft: #fbeaee;
    --paper: #fdf5f7;
    --ink: #211f1f;
    --ink-soft: #4a4646;
    --blue: #3548d4;
    --blue-deep: #2532a8;
    --line: rgba(33,31,31,0.18);
    --petal: #e7a9bb;
    --petal-2: #d98ca3;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--pink-bg);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }

  /* ---------- background texture ---------- */
  .bg-wash{
    position: fixed;
    inset:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 40%),
      radial-gradient(circle at 88% 92%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 45%),
      var(--pink-bg);
    z-index:-3;
  }

  /* ---------- petals ---------- */
  .petal-layer{
    position: fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index: 5;
  }
  .petal{
    position:absolute;
    top:-40px;
    opacity:0.85;
    will-change: transform;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .petal svg{ display:block; width:100%; height:100%; }
  @keyframes fall{
    0%{ transform: translate3d(0,-10vh,0) rotate(0deg); }
    100%{ transform: translate3d(var(--drift,40px), 110vh,0) rotate(340deg); }
  }

  /* ---------- entry overlay ---------- */
  #entry{
    position:fixed;
    inset:0;
    z-index:50;
    background: var(--pink-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    text-align:center;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  #entry.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #entry .heart{
    font-family:'Caveat', cursive;
    font-size:64px;
    color: var(--blue);
    line-height:1;
  }
  #entry h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(40px, 9vw, 64px);
    color: var(--blue);
    margin:0;
  }
  #entry p.sub{
    margin:0;
    font-size:13px;
    letter-spacing:1.5px;
    color: var(--ink-soft);
    text-transform:uppercase;
  }
  #entry button{
    margin-top:10px;
    border:none;
    background: var(--blue);
    color:#fff;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:1px;
    padding:12px 30px;
    border-radius:999px;
    cursor:pointer;
    transition: opacity 0.2s ease;
  }
  #entry button:hover{
    opacity:0.85;
  }

  /* ---------- sound toggle ---------- */
  #sound-toggle{
    position:fixed;
    top:18px;
    right:18px;
    z-index:40;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1.5px solid var(--blue);
    background: rgba(255,255,255,0.6);
    color: var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    opacity:0;
    transform: scale(0.85);
    transition: opacity 0.5s ease, transform 0.5s ease, background 0.2s ease;
  }
  #sound-toggle.show{ opacity:1; transform:scale(1); }
  #sound-toggle:hover{ background: rgba(255,255,255,0.9); }

  /* ---------- main card ---------- */
  main{
    position:relative;
    z-index:2;
    max-width: 620px;
    margin: 64px auto 90px;
    padding: 0 20px;
  }

  .frame{
    position:relative;
    background: var(--paper);
    border-radius: 4px;
    padding: 46px 34px 40px;
    box-shadow: 0 30px 60px -30px rgba(33,20,30,0.25);
  }

  .title-wrap{
    position:relative;
    text-align:start;
    margin-bottom: 26px;
    z-index: 3;
  }
  .title-wrap h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    color: var(--blue);
    font-size: clamp(46px, 9vw, 64px);
    line-height: 0.95;
    margin:0;
    transform: rotate(-4deg);
    display:inline-block;
  }
  .title-wrap .heart-mark{
    color: var(--blue);
    font-size:0.55em;
    vertical-align: 6px;
  }

  .photo-block{
    position:relative;
  }
  .photo-frame{
    overflow:hidden;
    border-radius: 2px;
    background:#fff;
  }
  .photo-frame img{
    display:block;
    width:100%;
    height:auto;
  }

  .details{
    text-align:center;
    margin-top: 30px;
  }
  .details p{
    margin:0 0 4px;
    font-weight:600;
    letter-spacing:1.4px;
    font-size: 15.5px;
    text-transform:uppercase;
    line-height:1.55;
  }
  .details .date{
    font-family:'Caveat', cursive;
    font-weight:700;
    color: var(--blue);
    font-size: clamp(38px, 8vw, 50px);
    margin: 8px 0 2px;
  }
  .details .venue{
    font-weight:600;
    letter-spacing:2px;
    font-size:14px;
  }

  /* ---------- countdown ---------- */
  .countdown-label{
    text-align:center;
    font-size:11px;
    letter-spacing:3px;
    color: var(--ink-soft);
    text-transform:uppercase;
    margin: 26px 0 16px;
  }
  .countdown{
    display:flex;
    justify-content:center;
    gap: 10px;
  }
  .countdown .cell{
    background: var(--pink-bg-soft);
    border: 1px solid rgba(53,72,212,0.14);
    border-radius: 10px;
    padding: 12px 6px 10px;
    min-width: 66px;
    text-align:center;
  }
  .countdown .num{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 32px;
    color: var(--blue);
    line-height:1;
    display:block;
    font-variant-numeric: tabular-nums;
  }
  .countdown .unit{
    display:block;
    margin-top:4px;
    font-size:9.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color: var(--ink-soft);
  }

  /* ---------- map button ---------- */
  .map-container {
    text-align: center;
    margin-top: 32px;
  }
  .map-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--blue);
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px -6px rgba(53, 72, 212, 0.4);
    transition: all 0.3s ease;
  }
  .map-btn:hover {
    background: var(--blue-deep);
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -6px rgba(53, 72, 212, 0.5);
  }
  .map-btn:active {
    transform: translateY(0);
  }
  .map-btn i {
    font-size: 15px;
  }

  footer{
    text-align:center;
    margin-top: 34px;
  }
  footer .sign{
    font-family:'Caveat', cursive;
    color: var(--blue);
    font-size: 24px;
  }

  @media (max-width: 480px){
    main{ margin: 44px auto 60px; }
    .frame{ padding: 34px 20px 30px; }
    .countdown{ gap: 7px; }
    .countdown .cell{ min-width: 56px; padding: 10px 4px 8px; }
    .countdown .num{ font-size: 26px; }
  }
</style>
</head>
<body>

<div class="bg-wash"></div>
<div class="petal-layer" id="petalLayer"></div>

<div id="entry">
  <div class="heart-mark heart">♡</div>
  <h1>We're Engaged</h1>
  <p class="sub">Ahmed &amp; Ghada</p>
  <button id="enterBtn" type="button">Open</button>
</div>

<button id="sound-toggle" type="button" aria-label="toggle music" title="Music on/off">♪</button>

<main>
  <div class="frame">
    <div class="title-wrap">
      <h1><span class="heart-mark">♡</span>We're<br>Engaged</h1>
    </div>

    <div class="photo-block">
      <div class="photo-frame">
        <img src="imgs/IMG_9623.PNG" alt="">
      </div>
    </div>

    <div class="details">
      <p>Join us for an engagement party<br>in honor of Ahmed and Ghada</p>
      <div class="date">09 · 09 · 2026</div>
      <p class="venue">At Rustic Venue</p>
    </div>

    <div class="countdown-label">COUNTING DOWN TO OUR DAY</div>
    <div class="countdown">
      <div class="cell"><span class="num" id="cd-days">00</span><span class="unit">Days</span></div>
      <div class="cell"><span class="num" id="cd-hours">00</span><span class="unit">Hours</span></div>
      <div class="cell"><span class="num" id="cd-mins">00</span><span class="unit">Min</span></div>
      <div class="cell"><span class="num" id="cd-secs">00</span><span class="unit">Sec</span></div>
    </div>

    <!-- زرار اللوكيشن بعد العداد مباشرة -->
    <div class="map-container">
      <button id="mapBtn" class="map-btn" type="button">
        <i class="fa-solid fa-location-dot"></i>
        <span>View on Google Maps</span>
      </button>
    </div>

    <footer>
      <div class="sign">See you there ♡</div>
    </footer>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
/* ---------------- countdown ---------------- */
var targetDate = new Date("2026-09-09T19:00:00");

function updateCountdown(){
  var now = new Date();
  var diff = targetDate - now;
  if(diff < 0) diff = 0;
  var d = Math.floor(diff / (1000*60*60*24));
  var h = Math.floor((diff / (1000*60*60)) % 24);
  var m = Math.floor((diff / (1000*60)) % 60);
  var s = Math.floor((diff / 1000) % 60);
  document.getElementById('cd-days').textContent = String(d).padStart(2,'0');
  document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-mins').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-secs').textContent = String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* ---------------- google maps location ---------------- */
// غير الإحداثيات هنا بإحداثيات القاعة المضبوطة


document.getElementById('mapBtn').addEventListener('click', function() {
  var googleMapsUrl = `https://maps.app.goo.gl/dNAkUuvqLbjRszPp9?g_st=ic`;
  window.open(googleMapsUrl, '_blank');
});

/* ---------------- falling rose petals ---------------- */
function petalSVG(color){
  return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M20 2 C30 8 34 20 20 38 C6 20 10 8 20 2 Z" fill="'+color+'"/>' +
    '</svg>';
}
var petalLayer = document.getElementById('petalLayer');
var colors = ['#e7a9bb', '#d98ca3', '#f2c4d1', '#c97b95'];

function spawnPetal(){
  var el = document.createElement('div');
  el.className = 'petal';
  var size = 10 + Math.random()*14;
  var left = Math.random()*100;
  var duration = 9 + Math.random()*8;
  var delay = Math.random()*4;
  var drift = (Math.random()*160 - 80) + 'px';
  el.style.left = left + 'vw';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.setProperty('--drift', drift);
  el.style.animationDuration = duration + 's';
  el.style.animationDelay = delay + 's';
  el.innerHTML = petalSVG(colors[Math.floor(Math.random()*colors.length)]);
  petalLayer.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, (duration+delay)*1000 + 500);
}

var petalInterval = null;
function startPetals(){
  for(var i=0;i<14;i++){ setTimeout(spawnPetal, i*250); }
  petalInterval = setInterval(spawnPetal, 700);
}

/* ---------------- ambient music ---------------- */
var musicStarted = false;
var musicPlaying = false;

var musicUrl = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

var bgMusic = new Audio(musicUrl);
bgMusic.loop = true;
bgMusic.volume = 0.5;

function startMusic() {
  bgMusic.play().then(function () {
    musicStarted = true;
    musicPlaying = true;
  }).catch(function (error) {
    console.error("تعذر تشغيل الصوت تلقائياً:", error);
  });
}

function stopMusic() {
  bgMusic.pause();
  musicPlaying = false;
}

document.getElementById('enterBtn').addEventListener('click', function () {
  document.getElementById('entry').classList.add('hidden');
  document.getElementById('sound-toggle').classList.add('show');
  
  if (typeof startPetals === 'function') {
    startPetals();
  }
  
  startMusic();
});

document.getElementById('sound-toggle').addEventListener('click', function () {
  if (musicPlaying) {
    stopMusic();
    this.style.opacity = '0.55';
  } else {
    startMusic();
    this.style.opacity = '1';
  }
});
</script>
</body>
</html>
